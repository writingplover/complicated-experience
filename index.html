<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Air Stage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main id="stage" class="stage" data-state="idle" data-level="watching">
      <div id="crowd" class="crowd">
        <video data-crowd="bored" src="/crowd/crowd-1-bored.mp4" muted loop playsinline preload="auto"></video>
        <video data-crowd="mid" src="/crowd/crowd-2-mid.mp4" muted loop playsinline preload="auto"></video>
        <video data-crowd="excited" src="/crowd/crowd-3-excited.mp4" muted loop playsinline preload="auto"></video>
        <div class="crowd-fallback"></div>
        <div class="lights"></div>
      </div>
      <div id="flash" class="flash"></div>

      <div id="meter" class="meter wa-win" aria-hidden="true" style="--e: 0"><div class="meter-track"><div class="meter-fill"></div><div class="meter-knob"></div></div></div>

      <!-- Compact Winamp-flavoured deck: time, spectrum, title, progress, transport. -->
      <div class="dock">
        <section id="winamp" class="wa wa-win">
          <header class="wa-title"><span class="wa-title-text">AIR STAGE</span><span class="wa-title-btns"><i></i><i></i></span></header>
          <div class="wa-body">
            <div class="wa-display">
              <div class="wa-clock"><span class="wa-playstate" id="wa-playstate">■</span><span class="wa-time" id="wa-time">00:00</span></div>
              <canvas class="wa-spectrum" id="wa-spectrum" width="76" height="16"></canvas>
              <div class="wa-marquee"><span id="wa-marquee">Air Stage · press play</span></div>
            </div>
            <div class="wa-seek"><div class="wa-seek-fill" id="wa-seek-fill"></div></div>
            <div class="wa-transport">
              <button data-action="reset" title="Reset (Esc twice)" type="button">⏮</button>
              <button data-action="start" title="Start (Space)" type="button">▶</button>
              <button data-action="end" title="End performance (Esc)" type="button">⏹</button>
              <button data-action="skip" title="Skip calibration" type="button">⏭</button>
              <button data-action="source" title="Camera / demo (M)" type="button">⏏</button>
              <span class="wa-lamp" id="wa-lamp-cam">cam</span>
              <span class="wa-lamp" id="wa-lamp-demo">demo</span>
              <button class="wa-toggle is-on" data-action="ghost" id="wa-btn-ghost" title="Ghost line (G)" type="button">ghost</button>
              <button class="wa-toggle" data-action="again" title="Perform again (R)" type="button">↻</button>
            </div>
          </div>
        </section>
        <aside id="debug" class="debug" hidden></aside>
      </div>

      <!-- The player, small, bottom right -->
      <section class="pip wa-win" id="pip">
        <header class="wa-title"><span class="wa-title-text">AIR STAGE VIDEO</span><span class="wa-title-btns"><i></i><i></i></span></header>
        <div class="pip-body">
          <video id="camera" class="camera" muted playsinline></video>
          <canvas id="figure" class="figure"></canvas>
        </div>
      </section>

      <div id="prompt" class="prompt">
        <div class="prompt-ring" hidden></div>
        <h1 class="prompt-title"></h1>
        <p class="prompt-sub"></p>
      </div>
      <div id="countdown" class="countdown" hidden></div>
      <div id="callout" class="callout"></div>

      <div class="notes">
        <p class="privacy">Camera frames stay in this browser. Nothing is recorded or uploaded.</p>
        <p id="hint" class="hint"></p>
      </div>

      <section id="final" class="final" hidden>
        <div class="final-inner">
          <canvas class="final-canvas"></canvas>
          <p class="final-kicker">Hero pose</p>
          <h2 class="final-title"></h2>
          <p class="final-score"></p>
          <div class="final-actions">
            <button class="final-download" type="button">Download frame</button>
            <button class="final-again" type="button">Perform again</button>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
